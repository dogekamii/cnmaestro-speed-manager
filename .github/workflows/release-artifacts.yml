name: Prepare unsigned beta artifacts
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version label (for example 2.0.0-beta.2)
        required: true
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install -e ".[dev]"
      - name: Validate release input against runtime version
        shell: pwsh
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          python -c "from packaging.version import Version; import operations_toolkit; assert Version('$env:VERSION_INPUT') == Version(operations_toolkit.__version__), f'version input does not match runtime {operations_toolkit.__version__}'"
      - run: python -m pytest --ignore=tests/test_ui.py
      - name: Run Windows UI tests in isolated interpreters
        shell: pwsh
        run: |
          $nodes = python -m pytest --collect-only -q tests/test_ui.py |
            Where-Object { $_ -like "tests/test_ui.py::*" }
          if ($nodes.Count -eq 0) { throw "No UI tests collected" }
          foreach ($node in $nodes) {
            python -m pytest -q $node
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - run: ruff check .
      - run: mypy src/operations_toolkit
      - run: pyinstaller --clean --noconfirm OperationsToolkit.spec
      - run: .\dist\OperationsToolkit.exe --smoke-test
      - shell: pwsh
        run: |
          $hash = (Get-FileHash .\dist\OperationsToolkit.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  OperationsToolkit.exe" | Set-Content -NoNewline .\dist\SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: OperationsToolkit-${{ inputs.version }}-unsigned
          path: |
            dist/OperationsToolkit.exe
            dist/SHA256SUMS
