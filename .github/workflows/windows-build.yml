name: Windows build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Python syntax and import compile
        env:
          OPERATIONS_TOOLKIT_PREVIEW: '1'
        run: |
          python -m py_compile cnmaestro_speed_manager.py
          python -c "import cnmaestro_speed_manager"
      - name: Verify v1.1 AST behavior equivalence
        run: python release_checks/ast_behavior_guard.py
      - name: Build versioned one-file Windows EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "Operations-Toolkit-v1.2.0" cnmaestro_speed_manager.py
      - name: Smoke-test GUI launch
        shell: pwsh
        run: |
          $env:OPERATIONS_TOOLKIT_PREVIEW = '1'
          $exe = Resolve-Path '.\dist\Operations-Toolkit-v1.2.0.exe'
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {
            throw "GUI exited immediately with code $($process.ExitCode)"
          }
          $null = $process.CloseMainWindow()
          if (-not $process.WaitForExit(5000)) {
            Stop-Process -Id $process.Id
            Wait-Process -Id $process.Id -ErrorAction SilentlyContinue
          }
          Write-Host 'GUI remained alive for 8 seconds and was closed cleanly.'
      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $name = 'Operations-Toolkit-v1.2.0.exe'
          $hash = (Get-FileHash ".\dist\$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content -NoNewline -Encoding ascii .\dist\SHA256SUMS
          Get-Content .\dist\SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Operations-Toolkit-v1.2.0-windows
          if-no-files-found: error
          path: |
            dist/Operations-Toolkit-v1.2.0.exe
            dist/SHA256SUMS
