name: Windows build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Credential persistence unit tests
        run: python -m unittest -v tests/test_credentials.py
      - name: Mosaic service and credential tests
        run: |
          python -m unittest -v tests/test_mosaic_service.py
          python -m unittest -v tests/test_mosaic_credentials.py
      - name: Mosaic in-app UI tests
        env:
          OPERATIONS_TOOLKIT_PREVIEW: '1'
        run: python -m unittest -v tests/test_mosaic_ui.py
      - name: Candidate version tests
        run: python -m unittest -v tests/test_version_candidate.py
      - name: Verify Windows Credential Manager backend
        run: python -c "import keyring.backends.Windows as backend; assert backend.WinVaultKeyring.priority > 0"
      - name: Updater unit tests
        run: python -m unittest -v tests/test_updater.py
      - name: Inline tool view UI tests
        env:
          OPERATIONS_TOOLKIT_PREVIEW: '1'
        run: python -m unittest -v tests/test_inline_tool_views.py
      - name: Python syntax and import compile
        env:
          OPERATIONS_TOOLKIT_PREVIEW: '1'
        run: |
          python -m py_compile cnmaestro_speed_manager.py
          python -c "import cnmaestro_speed_manager"
      - name: Verify v1.1 AST behavior equivalence
        run: python release_checks/ast_behavior_guard.py
      - name: Build versioned one-file Windows EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --hidden-import keyring.backends.Windows --name "Operations-Toolkit-v1.5.0" cnmaestro_speed_manager.py
      - name: Smoke-test GUI launch
        shell: pwsh
        run: |
          $env:OPERATIONS_TOOLKIT_PREVIEW = '1'
          $env:OPERATIONS_TOOLKIT_SMOKE_NAV = '1'
          $exe = Resolve-Path '.\dist\Operations-Toolkit-v1.5.0.exe'
          $launcher = Start-Process -FilePath $exe -PassThru
          $deadline = (Get-Date).AddSeconds(12)
          $windowProcess = $null
          do {
            Start-Sleep -Milliseconds 500
            if ($launcher.HasExited) {
              throw "GUI exited immediately with code $($launcher.ExitCode)"
            }
            $windowProcess = Get-Process | Where-Object {
              $_.MainWindowTitle -eq 'Operations Toolkit - inline views smoke complete'
            } | Select-Object -First 1
          } while (-not $windowProcess -and (Get-Date) -lt $deadline)
          if (-not $windowProcess) {
            throw 'Inline view navigation smoke did not expose the completion window.'
          }
          $null = $windowProcess.CloseMainWindow()
          if (-not $windowProcess.WaitForExit(5000)) {
            Stop-Process -Id $windowProcess.Id
            Wait-Process -Id $windowProcess.Id -ErrorAction SilentlyContinue
          }
          if (-not $launcher.HasExited) {
            $launcher.WaitForExit(5000) | Out-Null
          }
          Write-Host 'GUI opened and returned from both inline action views, remained alive, and was closed cleanly.'
      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $name = 'Operations-Toolkit-v1.5.0.exe'
          $hash = (Get-FileHash ".\dist\$name" -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content -NoNewline -Encoding ascii .\dist\SHA256SUMS
          Get-Content .\dist\SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: Operations-Toolkit-v1.5.0-windows
          if-no-files-found: error
          path: |
            dist/Operations-Toolkit-v1.5.0.exe
            dist/SHA256SUMS
