[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "operations-toolkit"
version = "2.0.0b1"
description = "Modular, safety-first Windows operations desktop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "platformdirs>=4,<5", "ttkbootstrap>=1.10,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.9", "mypy>=1.13", "pyinstaller>=6"]

[project.scripts]
operations-toolkit = "operations_toolkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/operations_toolkit"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["operations_toolkit"]
mypy_path = "src"
exclude = ["build", "dist"]
